<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/PokeFan/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Pokefan</title>
    <link rel="stylesheet" href="tp-semana-04-CaioXQ123/public/css/pokedex-css/pokedex.css">
    <link rel="icon" href="tp-semana-04-CaioXQ123/public/images/favicon/favicon-16x16.png">
</head>

<body>
    <header>
        <div class="cabecalho">
            <a href="./">
                <img src="tp-semana-04-CaioXQ123/public/images/logo/download.png" alt="Logo Pokemon" class="logo_pokemon">
                <h1 class="titulo_do_site">PokeFan</h1>
            </a>
        </div>
    </header>
    <aside class="container-fluid">
        <div class="row m-3 g-2">
            <nav class="barra_lateral col-12 col-sm-12 col-md-3 col-lg-3">
                <ul class="lista_navegacao me-4">
                    <li><a href="./tp-semana-04-CaioXQ123/public/html/pokedex.html">POKEDÉX</a></li>
                    <li><a href="./tp-semana-04-CaioXQ123/public/html/regioes.html">REGIÕES</a></li>
                    <li><a href="./tp-semana-04-CaioXQ123/public/html/obras.html">OBRAS</a></li>
                    <li><a href="./tp-semana-04-CaioXQ123/public/html/fanarts.html">FAN ARTS</a></li>
                </ul>
            </nav>
        </div>
    </aside>
    <main>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/6.gif"
            alt="pokemon" class="pokemon__image">

        <h1 class="pokemon__data">
            <span class="pokemon__number"></span> -
            <span class="pokemon__name"></span>
        </h1>

        <form class="form">
            <input type="search" class="input__search" placeholder="Nome ou número" required />
        </form>

        <div class="buttons">
            <button class="button btn-prev">Anterior &lt;</button>
            <button class="button btn-next">Próximo &gt;</button>
        </div>

        <img src="tp-semana-04-CaioXQ123/public/images/pokedex/pokedex.png" alt="Pokedex" id="pokedex">
    </main>

    <footer class="fs-6"> &copy; Caio Xavier (Inspired by The Pokémon Company)</footer>
    <script src="tp-semana-04-CaioXQ123/public/js/pokedex.js"></script>
</body>

</html>
